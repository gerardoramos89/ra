<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>GRTEC WebAR</title>


    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- MINDAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;
        }


        /* =====================================
           MENSAJE SUPERIOR
        ===================================== */

        #message {

            position: fixed;

            z-index: 9999;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 40px);

            max-width: 450px;

            box-sizing: border-box;

            padding: 14px 20px;

            border-radius: 30px;

            background: rgba(0, 0, 0, .78);

            color: white;

            text-align: center;

            font-size: 17px;

            line-height: 1.3;

        }


        /* =====================================
           VENTANA DE RESULTADO
        ===================================== */

        #result {

            display: none;

            position: fixed;

            z-index: 10000;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            width: calc(100% - 40px);

            max-width: 430px;

            max-height: 85vh;

            overflow-y: auto;

            box-sizing: border-box;

            padding: 15px;

            border-radius: 22px;

            background: rgba(0, 0, 0, .92);

            box-shadow:

                0 15px 50px rgba(0, 0, 0, .65);

            text-align: center;

        }


        #result.show {

            display: block;

        }


        /* =====================================
           FOTOGRAFÍA
        ===================================== */

        #resultImage {

            display: block;

            width: 100%;

            max-height: 60vh;

            object-fit: contain;

            border-radius: 15px;

            margin: 0 auto 15px auto;

        }


        /* =====================================
           TITULO
        ===================================== */

        #resultTitle {

            color: white;

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 8px;

        }


        #resultText {

            color: #ddd;

            font-size: 14px;

            margin-bottom: 15px;

        }


        /* =====================================
           BOTON DESCARGAR
        ===================================== */

        #downloadButton {

            display: block;

            width: 100%;

            box-sizing: border-box;

            padding: 16px;

            border-radius: 15px;

            background: white;

            color: #062f2d;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 10px;

        }


        #downloadButton:active {

            transform: scale(.98);

        }


        /* =====================================
           CERRAR
        ===================================== */

        #closeButton {

            width: 100%;

            padding: 13px;

            border: 1px solid rgba(255,255,255,.3);

            border-radius: 15px;

            background: transparent;

            color: white;

            font-size: 15px;

            cursor: pointer;

        }


        /* A-FRAME */

        a-scene {

            position: fixed !important;

            top: 0;

            left: 0;

            width: 100% !important;

            height: 100% !important;

        }

    </style>

</head>


<body>


<!-- =====================================
     MENSAJE
===================================== -->

<div id="message">

    📷 Apunta la cámara a la fotografía

</div>



<!-- =====================================
     RESULTADO
===================================== -->

<div id="result">


    <!-- FOTO -->

    <img
        id="resultImage"
        src="./assets/fotografia.jpeg"
        alt="Fotografía GRTEC"
    >


    <!-- TITULO -->

    <div id="resultTitle">

        🎯 ¡Fotografía reconocida!

    </div>


    <!-- TEXTO -->

    <div id="resultText">

        GRTEC reconoció correctamente la fotografía.

    </div>


    <!-- DESCARGAR -->

    <a
        id="downloadButton"
        href="./assets/fotografia.jpeg"
        download="GRTEC-fotografia.jpg"
    >

        ⬇️ Descargar fotografía

    </a>


    <!-- CERRAR -->

    <button
        id="closeButton"
    >

        📷 Volver a la cámara

    </button>


</div>



<!-- =====================================
     MINDAR
===================================== -->

<a-scene

    id="scene"

    mindar-image="
        imageTargetSrc: ./assets/fotografia.mind;
        uiLoading: yes;
        uiScanning: yes;
        uiError: yes;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
    "

    vr-mode-ui="
        enabled: false;
    "

    device-orientation-permission-ui="
        enabled: false;
    "
>


    <!-- CÁMARA -->

    <a-camera

        position="0 0 0"

        look-controls="
            enabled: false;
        "

    >
    </a-camera>



    <!-- TARGET -->

    <a-entity

        id="target"

        mindar-image-target="
            targetIndex: 0;
        "

    >
    </a-entity>


</a-scene>



<script>


    /* =====================================
       ELEMENTOS
    ===================================== */

    const scene =
        document.querySelector("#scene");


    const target =
        document.querySelector("#target");


    const message =
        document.querySelector("#message");


    const result =
        document.querySelector("#result");


    const closeButton =
        document.querySelector("#closeButton");



    /* =====================================
       A-FRAME CARGADO
    ===================================== */

    scene.addEventListener(

        "loaded",

        function () {

            console.log(
                "GRTEC: A-Frame cargado"
            );

        }

    );



    /* =====================================
       AR LISTO
    ===================================== */

    scene.addEventListener(

        "arReady",

        function () {

            console.log(
                "GRTEC: AR listo"
            );

            message.innerHTML =
                "📷 Apunta la cámara a la fotografía";

        }

    );



    /* =====================================
       ERROR
    ===================================== */

    scene.addEventListener(

        "arError",

        function (event) {

            console.error(
                "GRTEC AR ERROR:",
                event
            );

            message.innerHTML =
                "❌ No se pudo iniciar la cámara";

        }

    );



    /* =====================================
       TARGET ENCONTRADO
    ===================================== */

    target.addEventListener(

        "targetFound",

        function () {

            console.log(
                "🎯 GRTEC TARGET FOUND"
            );


            /*
             * Cambiar mensaje
             */

            message.innerHTML =
                "🎯 ¡Fotografía reconocida!";


            /*
             * Mostrar resultado
             */

            result.classList.add(
                "show"
            );


            /*
             * Ocultar mensaje
             */

            message.style.display =
                "none";

        }

    );



    /* =====================================
       TARGET PERDIDO
    ===================================== */

    target.addEventListener(

        "targetLost",

        function () {

            console.log(
                "🎯 GRTEC TARGET LOST"
            );

        }

    );



    /* =====================================
       CERRAR RESULTADO
    ===================================== */

    closeButton.addEventListener(

        "click",

        function () {

            result.classList.remove(
                "show"
            );


            message.style.display =
                "block";


            message.innerHTML =
                "📷 Apunta la cámara a la fotografía";

        }

    );


</script>


</body>

</html>
