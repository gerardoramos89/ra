<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GRTEC WebAR</title>

    <!-- A-Frame oficial compatible -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;

        }


        /*
         * IMPORTANTE:
         *
         * NO ponemos CSS sobre a-scene.
         *
         * MindAR controla la cámara y el canvas.
         */


        #message {

            position: fixed;

            z-index: 100;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 40px);

            max-width: 450px;

            padding: 14px 20px;

            box-sizing: border-box;

            border-radius: 30px;

            background: rgba(0, 0, 0, .80);

            color: white;

            text-align: center;

            font-size: 17px;

        }


        #result {

            display: none;

            position: fixed;

            z-index: 200;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: calc(100% - 40px);

            max-width: 430px;

            max-height: 85vh;

            overflow-y: auto;

            box-sizing: border-box;

            padding: 15px;

            border-radius: 20px;

            background: rgba(0, 0, 0, .93);

            color: white;

            text-align: center;

        }


        #result.show {

            display: block;

        }


        #resultImage {

            display: block;

            width: 100%;

            max-height: 60vh;

            object-fit: contain;

            border-radius: 15px;

            margin-bottom: 15px;

        }


        #resultTitle {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 8px;

        }


        #resultText {

            font-size: 14px;

            color: #ddd;

            margin-bottom: 15px;

        }


        #downloadButton {

            display: block;

            width: 100%;

            box-sizing: border-box;

            padding: 16px;

            border-radius: 15px;

            background: white;

            color: #062f2d;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

        }


        #closeButton {

            width: 100%;

            margin-top: 10px;

            padding: 14px;

            border-radius: 15px;

            border: 1px solid rgba(255,255,255,.3);

            background: transparent;

            color: white;

            font-size: 16px;

        }

    </style>

</head>


<body>


<!-- ======================================
     MENSAJE
======================================= -->

<div id="message">

    📷 Iniciando cámara...

</div>



<!-- ======================================
     RESULTADO
======================================= -->

<div id="result">


    <img
        id="resultImage"
        src="./assets/fotografia.jpeg"
        alt="Fotografía GRTEC"
    >


    <div id="resultTitle">

        🎯 ¡Fotografía reconocida!

    </div>


    <div id="resultText">

        GRTEC reconoció la fotografía.

    </div>


    <a
        id="downloadButton"
        href="./assets/fotografia.jpeg"
        download="GRTEC-fotografia.jpeg"
    >

        ⬇️ Descargar fotografía

    </a>


    <button id="closeButton">

        📷 Volver a la cámara

    </button>


</div>



<!-- ======================================
     MINDAR
======================================= -->

<a-scene

    mindar-image="
        imageTargetSrc: ./assets/fotografia.mind;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        physicallyCorrectLights;
    "

    vr-mode-ui="
        enabled: false;
    "

    device-orientation-permission-ui="
        enabled: false;
    "

>


    <!-- ==================================
         CÁMARA
    =================================== -->

    <a-camera

        position="0 0 0"

        look-controls="
            enabled: false;
        "

    ></a-camera>



    <!-- ==================================
         TARGET
    =================================== -->

    <a-entity

        id="photoTarget"

        mindar-image-target="
            targetIndex: 0;
        "

    >

    </a-entity>


</a-scene>



<script>


/* ======================================
   ELEMENTOS
======================================= */

const scene =
    document.querySelector("a-scene");


const target =
    document.querySelector("#photoTarget");


const message =
    document.querySelector("#message");


const result =
    document.querySelector("#result");


const closeButton =
    document.querySelector("#closeButton");



/* ======================================
   A-FRAME CARGADO
======================================= */

scene.addEventListener(
    "loaded",
    () => {

        console.log(
            "GRTEC: A-Frame cargado"
        );

    }
);



/* ======================================
   MINDAR LISTO
======================================= */

scene.addEventListener(
    "arReady",
    () => {

        console.log(
            "GRTEC: AR READY"
        );

        message.innerHTML =
            "📷 Apunta la cámara a la fotografía";

    }
);



/* ======================================
   ERROR MINDAR
======================================= */

scene.addEventListener(
    "arError",
    (event) => {

        console.error(
            "GRTEC: AR ERROR",
            event
        );

        message.innerHTML =
            "❌ Error al iniciar la cámara";

    }
);



/* ======================================
   TARGET ENCONTRADO
======================================= */

target.addEventListener(
    "targetFound",
    () => {

        console.log(
            "🎯 TARGET FOUND"
        );

        result.classList.add(
            "show"
        );

        message.style.display =
            "none";

    }
);



/* ======================================
   TARGET PERDIDO
======================================= */

target.addEventListener(
    "targetLost",
    () => {

        console.log(
            "🎯 TARGET LOST"
        );

    }
);



/* ======================================
   VOLVER A CÁMARA
======================================= */

closeButton.addEventListener(
    "click",
    () => {

        result.classList.remove(
            "show"
        );

        message.style.display =
            "block";

        message.innerHTML =
            "📷 Apunta la cámara a la fotografía";

    }
);


</script>


</body>

</html>
