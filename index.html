<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>GRTEC WebAR</title>


    <!--
        IMPORTMAP
    -->

    <script type="importmap">
    {
        "imports": {

            "three":
            "https://unpkg.com/three@0.160.0/build/three.module.js",

            "three/addons/":
            "https://unpkg.com/three@0.160.0/examples/jsm/",

            "mindar-image-three":
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"

        }
    }
    </script>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;

        }


        /*
         * CONTENEDOR AR
         */

        #container {

            position: fixed;

            top: 0;

            left: 0;

            width: 100vw;

            height: 100vh;

            overflow: hidden;

            background: #000;

        }


        /*
         * EL VIDEO DE LA CÁMARA
         */

        #cameraVideo {

            position: fixed;

            top: 0;

            left: 0;

            width: 100vw;

            height: 100vh;

            object-fit: cover;

            z-index: 1;

            background: #000;

        }


        /*
         * CANVAS THREE.JS
         */

        #container canvas {

            position: fixed !important;

            top: 0 !important;

            left: 0 !important;

            width: 100vw !important;

            height: 100vh !important;

            z-index: 2 !important;

            pointer-events: none;

        }


        /*
         * MENSAJE
         */

        #message {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            width: calc(100% - 40px);

            max-width: 430px;

            padding: 14px 20px;

            box-sizing: border-box;

            border-radius: 30px;

            background: rgba(0,0,0,.75);

            color: white;

            text-align: center;

            font-size: 17px;

        }


        /*
         * RESULTADO
         */

        #result {

            display: none;

            position: fixed;

            z-index: 20;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: calc(100% - 40px);

            max-width: 430px;

            max-height: 85vh;

            overflow-y: auto;

            padding: 15px;

            box-sizing: border-box;

            border-radius: 20px;

            background: rgba(0,0,0,.93);

            text-align: center;

        }


        #result.show {

            display: block;

        }


        #resultImage {

            width: 100%;

            max-height: 60vh;

            object-fit: contain;

            border-radius: 15px;

        }


        #resultTitle {

            color: white;

            font-size: 21px;

            font-weight: bold;

            margin: 15px 0 8px;

        }


        #resultText {

            color: #ddd;

            font-size: 14px;

            margin-bottom: 15px;

        }


        #downloadButton {

            display: block;

            width: 100%;

            box-sizing: border-box;

            padding: 16px;

            border-radius: 15px;

            background: white;

            color: #062f2d;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

        }


        #closeButton {

            width: 100%;

            margin-top: 10px;

            padding: 14px;

            border-radius: 15px;

            border: 1px solid rgba(255,255,255,.3);

            background: transparent;

            color: white;

            font-size: 16px;

        }


        /*
         * LOADING
         */

        #loading {

            position: fixed;

            inset: 0;

            z-index: 30;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000;

            color: white;

            font-size: 18px;

        }


        #loading.hidden {

            display: none;

        }

    </style>

</head>


<body>


<!-- =====================================
     LOADING
===================================== -->

<div id="loading">

    ⏳ Iniciando cámara...

</div>


<!-- =====================================
     CÁMARA
===================================== -->

<video
    id="cameraVideo"
    autoplay
    muted
    playsinline
></video>


<!-- =====================================
     THREE.JS / AR
===================================== -->

<div id="container"></div>


<!-- =====================================
     MENSAJE
===================================== -->

<div id="message">

    📷 Apunta la cámara a la fotografía

</div>


<!-- =====================================
     RESULTADO
===================================== -->

<div id="result">


    <img
        id="resultImage"
        src="./assets/fotografia.jpeg"
        alt="Fotografía GRTEC"
    >


    <div id="resultTitle">

        🎯 ¡Fotografía reconocida!

    </div>


    <div id="resultText">

        GRTEC reconoció correctamente la fotografía.

    </div>


    <a
        id="downloadButton"
        href="./assets/fotografia.jpeg"
        download="GRTEC-fotografia.jpeg"
    >

        ⬇️ Descargar fotografía

    </a>


    <button id="closeButton">

        📷 Volver a la cámara

    </button>


</div>


<script type="module">

    import * as THREE
        from "three";


    import {
        MindARThree
    }
    from "mindar-image-three";


    /*
     * ELEMENTOS
     */

    const container =
        document.querySelector("#container");


    const videoElement =
        document.querySelector("#cameraVideo");


    const loading =
        document.querySelector("#loading");


    const message =
        document.querySelector("#message");


    const result =
        document.querySelector("#result");


    const closeButton =
        document.querySelector("#closeButton");


    /*
     * MINDAR
     */

    const mindarThree =
        new MindARThree({

            container: container,

            imageTargetSrc:
                "./assets/fotografia.mind",

            uiLoading: "yes",

            uiScanning: "yes",

            uiError: "yes"

        });


    /*
     * COMPONENTES THREE
     */

    const {
        renderer,
        scene,
        camera
    } = mindarThree;


    /*
     * TARGET
     */

    const anchor =
        mindarThree.addAnchor(0);


    /*
     * RECTÁNGULO DE PRUEBA
     *
     * Si aparece sobre la fotografía,
     * sabemos que el tracking funciona.
     */

    const geometry =
        new THREE.PlaneGeometry(
            1,
            0.75
        );


    const material =
        new THREE.MeshBasicMaterial({

            color: 0x00ff00,

            transparent: true,

            opacity: 0.15

        });


    const plane =
        new THREE.Mesh(
            geometry,
            material
        );


    anchor.group.add(
        plane
    );


    /*
     * TARGET ENCONTRADO
     */

    anchor.onTargetFound = () => {

        console.log(
            "🎯 GRTEC TARGET FOUND"
        );


        message.innerHTML =
            "🎯 ¡Fotografía reconocida!";


        /*
         * Mostrar resultado
         */

        result.classList.add(
            "show"
        );

    };


    /*
     * TARGET PERDIDO
     */

    anchor.onTargetLost = () => {

        console.log(
            "🎯 GRTEC TARGET LOST"
        );

    };


    /*
     * INICIAR AR
     */

    async function startAR() {

        try {

            console.log(
                "GRTEC: iniciando MindAR..."
            );


            /*
             * Iniciar cámara
             */

            await mindarThree.start();


            console.log(
                "GRTEC: MindAR iniciado"
            );


            /*
             * OBTENER EL VIDEO REAL
             * QUE ESTÁ USANDO MINDAR
             */

            const stream =
                mindarThree.video.srcObject;


            /*
             * Conectarlo a nuestro
             * elemento <video>
             */

            videoElement.srcObject =
                stream;


            await videoElement.play();


            console.log(
                "GRTEC: video conectado"
            );


            /*
             * Ocultar loading
             */

            loading.classList.add(
                "hidden"
            );


            /*
             * Render loop
             */

            renderer.setAnimationLoop(
                () => {

                    renderer.render(
                        scene,
                        camera
                    );

                }
            );


        }

        catch (error) {

            console.error(
                "GRTEC ERROR:",
                error
            );


            loading.innerHTML =
                "❌ Error iniciando AR";


            message.innerHTML =
                error.message;

        }

    }


    /*
     * BOTÓN CERRAR
     */

    closeButton.addEventListener(
        "click",
        () => {

            result.classList.remove(
                "show"
            );

            message.innerHTML =
                "📷 Apunta la cámara a la fotografía";

        }
    );


    /*
     * START
     */

    startAR();

</script>


</body>

</html>
