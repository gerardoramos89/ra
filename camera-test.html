<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GRTEC WebAR Test</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./assets/fotografia.mind;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        physicallyCorrectLights;
    "

    vr-mode-ui="
        enabled: false;
    "

    device-orientation-permission-ui="
        enabled: false;
    "
>


    <a-camera

        position="0 0 0"

        look-controls="
            enabled: false;
        "

    ></a-camera>


    <a-entity
        mindar-image-target="targetIndex: 0"
    >

        <a-plane

            color="red"

            opacity="0.5"

            position="0 0 0"

            width="1"

            height="0.75"

        ></a-plane>

    </a-entity>


</a-scene>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const scene =
            document.querySelector("a-scene");


        scene.addEventListener(
            "loaded",
            function () {

                console.log(
                    "GRTEC: A-Frame cargado"
                );

            }
        );


        scene.addEventListener(
            "arReady",
            function () {

                console.log(
                    "GRTEC: AR READY"
                );

            }
        );


        scene.addEventListener(
            "arError",
            function (event) {

                console.error(
                    "GRTEC: AR ERROR",
                    event
                );

            }
        );


        const target =
            document.querySelector(
                "[mindar-image-target]"
            );


        target.addEventListener(
            "targetFound",
            function () {

                console.log(
                    "🎯 TARGET FOUND"
                );

            }
        );


        target.addEventListener(
            "targetLost",
            function () {

                console.log(
                    "🎯 TARGET LOST"
                );

            }
        );

    }

);

</script>


</body>

</html>
